services:
  db:
    image: postgres:16-alpine
    container_name: evaluacion_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evaluacion_db}
      POSTGRES_USER: ${POSTGRES_USER:-evaluacion_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evaluacion_pass}
    ports:
      - "${POSTGRES_HOST_PORT:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evaluacion_user} -d ${POSTGRES_DB:-evaluacion_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
