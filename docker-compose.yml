# Stack de SOMA: interfaz Angular (nginx), backend único, MySQL 8 y Mailpit
# (convocatorias, cambios, calificaciones y retroalimentaciones; RF-21, RF-27).
#   docker compose up -d --build   → interfaz en http://localhost:4200, backend en http://localhost:8080,
#                                    MySQL en localhost:3306 y bandeja de correo en http://localhost:8025
#   docker compose up -d db correo → sólo los servicios de apoyo (para correr el backend desde el IDE)
#   docker compose stop web        → libera el puerto 4200 para `npm start` en frontend/soma-web
# Por defecto el backend arranca con el perfil `pruebas` (datos semilla para Postman). Para producción:
#   SPRING_PROFILES_ACTIVE=default docker compose up -d --build
services:
  db:
    image: mysql:8.0
    container_name: soma_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-plataforma_casos}
      MYSQL_USER: ${MYSQL_USER:-plataforma}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cambiar-esta-clave}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cambiar-esta-clave-root}
      TZ: America/Bogota
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-cambiar-esta-clave-root}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: ./backend
    image: soma-backend:1.0.0
    container_name: soma_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      correo:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-pruebas}
      DB_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-plataforma_casos}?serverTimezone=America/Bogota&connectionCollation=utf8mb4_unicode_ci
      DB_USER: ${MYSQL_USER:-plataforma}
      DB_PASSWORD: ${MYSQL_PASSWORD:-cambiar-esta-clave}
      JWT_SECRETO: ${JWT_SECRETO:-}
      JWT_MINUTOS: ${JWT_MINUTOS:-60}
      DOMINIO_INSTITUCIONAL: ${DOMINIO_INSTITUCIONAL:-unihumboldt.edu.co,cue.edu.co,gmail.com,institucion.edu.co}
      CORS_ORIGENES: ${CORS_ORIGENES:-http://localhost:4200,http://127.0.0.1:4200}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_DOMINIOS: ${GOOGLE_DOMINIOS:-unihumboldt.edu.co,cue.edu.co,gmail.com}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      # Por defecto el correo se captura en Mailpit (http://localhost:8025) y NO llega a bandejas reales.
      # Para enviar correos de verdad, define SMTP_HOST, SMTP_PORT, SMTP_USUARIO, SMTP_CLAVE (ver .env.example).
      MAIL_HOST: ${SMTP_HOST:-correo}
      MAIL_PORT: ${SMTP_PORT:-1025}
      MAIL_USERNAME: ${SMTP_USUARIO:-}
      MAIL_PASSWORD: ${SMTP_CLAVE:-}
      MAIL_SMTP_AUTH: ${SMTP_AUTH:-false}
      MAIL_STARTTLS: ${SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@institucion.edu.co}
      ZONA_HORARIA: ${ZONA_HORARIA:-America/Bogota}
      POLITICA_INGRESO_TARDIO: ${POLITICA_INGRESO_TARDIO:-mitad}
    ports:
      - "${SERVER_PORT:-8080}:8080"

  web:
    build: ./frontend/soma-web
    image: soma-web:1.0.0
    container_name: soma_web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${WEB_PORT:-4200}:80"

  correo:
    image: axllent/mailpit:latest
    container_name: soma_correo
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mysql_data:
