spring:
  application:
    name: evaluacion-resultados
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:5435}/${MYSQL_DB:evaluacion_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
    username: ${MYSQL_USER:evaluacion_user}
    password: ${MYSQL_PASSWORD:evaluacion_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Bogota
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false

server:
  port: ${SERVER_PORT:8080}

app:
  mail:
    from: ${MAIL_FROM:no-reply@simulador.local}
  jwt:
    secret: ${JWT_SECRET:cambiar-esta-clave-jwt-de-al-menos-32-caracteres}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
