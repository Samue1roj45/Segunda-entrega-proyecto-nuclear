# Configuración única del backend (módulos 1 a 6). Las credenciales se leen de variables de entorno;
# nunca se escriben en el código. Ver .env.example en la raíz del repositorio.
spring:
  application:
    name: plataforma-casos
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/plataforma_casos?serverTimezone=America/Bogota&connectionCollation=utf8mb4_unicode_ci}
    username: ${DB_USER:plataforma}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # El esquema lo controla Flyway (migraciones de cada módulo), no Hibernate.
    properties:
      hibernate:
        jdbc:
          time_zone: America/Bogota
  flyway:
    # Cada módulo aporta sus migraciones: V1-V9 módulo 1, V20-V29 módulo 2, V30-V39 módulos 3 y 4,
    # V40-V49 módulos 5 y 6.
    locations: classpath:db/migration
  mail:
    # Acepta MAIL_* (Spring) o SMTP_* (los nombres de .env.example), para que Render y docker compose lean lo mismo.
    host: ${MAIL_HOST:${SMTP_HOST:localhost}}
    port: ${MAIL_PORT:${SMTP_PORT:1025}}
    username: ${MAIL_USERNAME:${SMTP_USUARIO:}}
    password: ${MAIL_PASSWORD:${SMTP_CLAVE:}}
    properties:
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          auth: ${MAIL_SMTP_AUTH:${SMTP_AUTH:false}}
          starttls:
            enable: ${MAIL_STARTTLS:${SMTP_STARTTLS:false}}

server:
  port: ${SERVER_PORT:8080}

app:
  # Zona horaria de las fechas de sesiones, intentos y notificaciones (Clock único de la aplicación).
  zona-horaria: ${ZONA_HORARIA:America/Bogota}
  google:
    # ID de cliente OAuth de Google (es público; el "secreto del cliente" NO se usa ni se pone aquí).
    client-id: ${GOOGLE_CLIENT_ID:}
    dominios: ${GOOGLE_DOMINIOS:unihumboldt.edu.co,cue.edu.co,gmail.com}
  invitaciones:
    # Base del enlace que llega por correo: dirección donde corre el frontend.
    url-frontend: ${FRONTEND_URL:http://localhost:4200}
    dias-vigencia: 7
    edad-minima: 14
  ecos:
    # URL pública que el juego usa para hablar con SOMA (va dentro del enlace ecos://).
    api-publica: ${ECOS_API_URL:http://localhost:8080/api/ecos/v1}
    minutos-codigo: 30
    horas-token: 6
    max-intentos: ${ECOS_MAX_INTENTOS:1}
    tolerancia-segundos: 10
    pixel-streaming:
      # Reproductor de Pixel Streaming (http/https). Si se define, el juego se ve dentro de la página del estudiante;
      # vacío = se abre en el computador con el enlace ecos://, como antes.
      url: ${ECOS_PIXEL_STREAMING_URL:}
  autenticacion:
    # Dominios aceptados por RF-01 (uno o varios, separados por coma). institucion.edu.co es el de las cuentas de prueba.
    dominio-institucional: ${DOMINIO_INSTITUCIONAL:unihumboldt.edu.co,cue.edu.co,gmail.com,institucion.edu.co}
  seguridad:
    # Clave HMAC (Base64, mínimo 32 bytes) para firmar los tokens de TODOS los módulos.
    # Si se deja vacía se genera una aleatoria al arrancar (los tokens no sobreviven a un reinicio).
    jwt-secreto: ${JWT_SECRETO:}
    minutos-token: ${JWT_MINUTOS:60}
  flyway:
    # Solo para recuperar un despliegue con una migración fallida (ver docs/recuperacion-flyway-render.md).
    reparar: ${FLYWAY_REPARAR:false}
  cors:
    # Orígenes de los frontends Angular, separados por coma.
    origenes: ${CORS_ORIGENES:http://localhost:4200}
  mail:
    from: ${MAIL_FROM:no-reply@institucion.edu.co}
  avisos:
    # Cada aviso de la campana también se envía al correo institucional del destinatario.
    correo: ${AVISOS_CORREO:true}
  sesiones:
    # RF-22: "mitad" (mitad del tiempo máximo) o "porcentaje" (porcentaje_limite_ingreso_tardio de la sesión).
    politica-ingreso-tardio: ${POLITICA_INGRESO_TARDIO:mitad}
    # RF-19 y RF-23: cada cuánto se cierran sesiones vencidas e intentos sin tiempo.
    intervalo-cierre-ms: 60000
    intervalo-expiracion-ms: 30000
    # RF-20: longitud del código de acceso que recibe cada estudiante convocado.
    longitud-codigo: 8

---
# Perfil para ejecutar los casos de prueba con datos ficticios (usuarios, un caso publicado y una sesión).
spring:
  config:
    activate:
      on-profile: pruebas
  flyway:
    locations: classpath:db/migration,classpath:db/semilla
    # El caso de prueba ya no se siembra; una base que lo tenía aplicado no debe fallar por su ausencia.
    ignore-migration-patterns: "*:missing"
