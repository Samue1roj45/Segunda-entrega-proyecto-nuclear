# Perfil de pruebas automatizadas: base H2 en memoria (modo MySQL) con las mismas migraciones de Flyway
# de los seis módulos y los datos ficticios. Cada contexto de Spring usa su propia base (nombre aleatorio),
# así las pruebas de un módulo no ven los datos que dejan las de otro.
spring:
  datasource:
    url: jdbc:h2:mem:${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: America/Bogota
  flyway:
    locations: classpath:db/migration,classpath:db/semilla
  mail:
    host: localhost
    port: 25

app:
  autenticacion:
    dominio-institucional: institucion.edu.co
  mail:
    from: no-reply@institucion.edu.co
  sesiones:
    # Las tareas programadas no corren durante las pruebas (se invocan a mano cuando se prueban).
    intervalo-cierre-ms: 3600000
    intervalo-expiracion-ms: 3600000
