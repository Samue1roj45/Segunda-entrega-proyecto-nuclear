<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220">
  <rect width="300" height="220" fill="#fffbeb"/>
  <rect x="0" y="0" width="300" height="20" fill="#b45309"/>
  <text x="150" y="14" text-anchor="middle" fill="#fff" font-size="9" font-family="Arial" font-weight="bold">TRABAJO SOCIAL</text>
  <!-- Division suave -->
  <rect x="0" y="28" width="8" height="192" fill="#d97706" opacity="0.3"/>
  <!-- Mesa reunion -->
  <ellipse cx="150" cy="120" rx="75" ry="32" fill="#d6d3d1"/>
  <ellipse cx="150" cy="115" rx="68" ry="28" fill="#e7e5e4"/>
  <!-- Sillas alrededor -->
  <g fill="#78716c">
    <rect x="60" y="88" width="20" height="24" rx="4" fill="#a8a29e"/>
    <rect x="220" y="88" width="20" height="24" rx="4" fill="#a8a29e"/>
    <rect x="60" y="148" width="20" height="24" rx="4" fill="#a8a29e"/>
    <rect x="220" y="148" width="20" height="24" rx="4" fill="#a8a29e"/>
  </g>
  <!-- Estanteria recursos -->
  <rect x="12" y="40" width="56" height="100" fill="#78716c"/>
  <rect x="16" y="48" width="48" height="12" fill="#fef3c7"/>
  <rect x="16" y="64" width="48" height="12" fill="#fde68a"/>
  <rect x="16" y="80" width="48" height="12" fill="#fef3c7"/>
  <!-- Pizarra -->
  <rect x="200" y="36" width="88" height="56" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <line x1="210" y1="50" x2="278" y2="50" stroke="#6ee7b7"/>
  <line x1="210" y1="62" x2="260" y2="62" stroke="#6ee7b7"/>
  <line x1="210" y1="74" x2="270" y2="74" stroke="#6ee7b7"/>
  <!-- Escritorio individual -->
  <rect x="200" y="168" width="88" height="10" fill="#57534e"/>
  <rect x="208" y="152" width="72" height="18" fill="#a8a29e"/>
  <rect x="248" y="156" width="24" height="12" fill="#1e293b"/>
  <!-- Cartel apoyo -->
  <rect x="100" y="168" width="100" height="36" rx="3" fill="#047857"/>
  <text x="150" y="186" text-anchor="middle" fill="#fff" font-size="8" font-family="Arial">ORIENTACION</text>
  <text x="150" y="198" text-anchor="middle" fill="#a7f3d0" font-size="7" font-family="Arial">y derivacion</text>
