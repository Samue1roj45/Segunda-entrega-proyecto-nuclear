<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220">
  <defs>
    <pattern id="carpet" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#eff6ff"/>
      <rect x="0" y="0" width="16" height="16" fill="#dbeafe" opacity="0.5"/>
      <rect x="16" y="16" width="16" height="16" fill="#dbeafe" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="400" height="220" fill="url(#carpet)"/>
  <rect x="0" y="0" width="400" height="18" fill="#0369a1"/>
  <text x="200" y="13" text-anchor="middle" fill="#fff" font-family="Arial" font-size="10" font-weight="bold">SALA DE ESPERA</text>
  <!-- Fila sillas -->
  <g>
    <rect x="40" y="50" width="36" height="44" rx="6" fill="#7dd3fc" stroke="#0284c7"/>
    <rect x="44" y="54" width="28" height="20" fill="#bae6fd"/>
    <rect x="100" y="50" width="36" height="44" rx="6" fill="#7dd3fc" stroke="#0284c7"/>
    <rect x="104" y="54" width="28" height="20" fill="#bae6fd"/>
    <rect x="160" y="50" width="36" height="44" rx="6" fill="#7dd3fc" stroke="#0284c7"/>
    <rect x="164" y="54" width="28" height="20" fill="#bae6fd"/>
    <rect x="220" y="50" width="36" height="44" rx="6" fill="#7dd3fc" stroke="#0284c7"/>
    <rect x="224" y="54" width="28" height="20" fill="#bae6fd"/>
    <rect x="280" y="55" width="36" height="44" rx="6" fill="#7dd3fc" stroke="#0284c7"/>
    <rect x="330" y="55" width="36" height="44" rx="6" fill="#7dd3fc" stroke="#0284c7"/>
  </g>
  <!-- Mesa centro -->
  <ellipse cx="200" cy="130" rx="70" ry="28" fill="#cbd5e1"/>
  <ellipse cx="200" cy="125" rx="65" ry="24" fill="#e2e8f0"/>
  <rect x="185" y="118" width="30" height="18" fill="#94a3b8" opacity="0.4"/>
  <!-- Revistero -->
  <rect x="12" y="42" width="22" height="120" fill="#64748b"/>
  <rect x="14" y="48" width="18" height="14" fill="#f8fafc"/>
  <rect x="14" y="66" width="18" height="14" fill="#f8fafc"/>
  <rect x="14" y="84" width="18" height="14" fill="#f8fafc"/>
  <!-- Reloj pared -->
  <circle cx="360" cy="42" r="22" fill="#fff" stroke="#1e40af" stroke-width="3"/>
  <circle cx="360" cy="42" r="2" fill="#1e40af"/>
  <line x1="360" y1="42" x2="360" y2="28" stroke="#1e40af" stroke-width="2"/>
  <line x1="360" y1="42" x2="372" y2="42" stroke="#1e40af" stroke-width="2"/>
  <!-- Cartel silencio -->
  <rect x="120" y="168" width="160" height="36" rx="3" fill="#1e3a8a"/>
  <text x="200" y="186" text-anchor="middle" fill="#fff" font-size="9" font-family="Arial">SILENCIO · FAVOR ESPERAR</text>
  <text x="200" y="198" text-anchor="middle" fill="#93c5fd" font-size="7" font-family="Arial">Zona de acompanantes</text>
  <!-- Planta decorativa -->
  <ellipse cx="380" cy="175" rx="18" ry="8" fill="#166534" opacity="0.3"/>
  <rect x="374" y="155" width="12" height="28" fill="#15803d"/>
  <ellipse cx="380" cy="148" rx="20" ry="14" fill="#22c55e"/>
</svg>
