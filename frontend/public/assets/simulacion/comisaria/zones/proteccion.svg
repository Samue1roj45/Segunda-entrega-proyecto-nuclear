<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220">
  <rect width="300" height="220" fill="#faf5ff"/>
  <rect x="0" y="0" width="300" height="22" fill="#6b21a8"/>
  <text x="150" y="15" text-anchor="middle" fill="#fff" font-size="9" font-family="Arial" font-weight="bold">PROTECCION · SALA SEGURA</text>
  <!-- Mampara division -->
  <rect x="140" y="30" width="120" height="8" fill="#c4b5fd" opacity="0.5"/>
  <rect x="140" y="30" width="8" height="140" fill="#a78bfa" opacity="0.4"/>
  <!-- Sofa -->
  <rect x="24" y="120" width="90" height="36" rx="8" fill="#7c3aed" opacity="0.25"/>
  <rect x="28" y="108" width="82" height="28" rx="6" fill="#8b5cf6" opacity="0.35"/>
  <!-- Mesa baja -->
  <rect x="40" y="168" width="60" height="8" fill="#78716c"/>
  <rect x="48" y="160" width="44" height="10" fill="#a8a29e"/>
  <!-- Escritorio oficial -->
  <rect x="168" y="100" width="100" height="10" fill="#57534e"/>
  <rect x="172" y="82" width="92" height="22" fill="#d6d3d1"/>
  <rect x="230" y="86" width="26" height="16" fill="#1e293b"/>
  <!-- Archivador cerrado -->
  <rect x="168" y="128" width="56" height="72" fill="#44403c"/>
  <rect x="172" y="132" width="48" height="10" fill="#78716c"/>
  <rect x="232" y="128" width="36" height="72" fill="#57534e" stroke="#7c3aed"/>
  <!-- Senal privacidad -->
  <rect x="12" y="40" width="100" height="32" rx="2" fill="#4c1d95"/>
  <text x="62" y="58" text-anchor="middle" fill="#e9d5ff" font-size="8" font-family="Arial">ENTREVISTA PRIVADA</text>
  <text x="62" y="68" text-anchor="middle" fill="#c4b5fd" font-size="6" font-family="Arial">No interrumpir</text>
  <!-- Reloj -->
  <circle cx="270" cy="48" r="16" fill="#fff" stroke="#6b21a8" stroke-width="2"/>
  <line x1="270" y1="48" x2="270" y2="38" stroke="#6b21a8"/>
</svg>
