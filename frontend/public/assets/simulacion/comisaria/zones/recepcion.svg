<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220">
  <defs>
    <pattern id="floor-p" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect width="48" height="48" fill="#e2e8f0"/>
      <rect x="0" y="0" width="24" height="24" fill="#cbd5e1" opacity="0.35"/>
      <rect x="24" y="24" width="24" height="24" fill="#cbd5e1" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="300" height="220" fill="url(#floor-p)"/>
  <!-- Muro institucional -->
  <rect x="0" y="24" width="300" height="88" fill="#f1f5f9" stroke="#94a3b8"/>
  <rect x="0" y="24" width="300" height="12" fill="#1e3a8a"/>
  <text x="150" y="34" text-anchor="middle" fill="#fff" font-size="9" font-family="Arial" font-weight="bold">COMISARIA · RECEPCION</text>
  <!-- Escudo -->
  <circle cx="40" cy="70" r="22" fill="#1e40af" stroke="#fbbf24" stroke-width="3"/>
  <text x="40" y="75" text-anchor="middle" fill="#fff" font-size="14" font-family="Arial">P</text>
  <!-- Mostrador vidrio -->
  <rect x="80" y="68" width="160" height="12" fill="#334155"/>
  <rect x="88" y="52" width="144" height="24" fill="#bae6fd" opacity="0.35" stroke="#64748b"/>
  <rect x="88" y="80" width="144" height="56" fill="#64748b" opacity="0.2"/>
  <!-- Barrera -->
  <rect x="72" y="140" width="4" height="48" fill="#dc2626"/>
  <rect x="72" y="140" width="120" height="4" fill="#dc2626"/>
  <rect x="188" y="140" width="4" height="48" fill="#dc2626"/>
  <!-- Silla visitante -->
  <rect x="220" y="160" width="28" height="8" fill="#475569"/>
  <rect x="224" y="148" width="20" height="14" rx="2" fill="#64748b"/>
  <!-- Cartel horario -->
  <rect x="200" y="42" width="88" height="22" fill="#fff" stroke="#1e40af"/>
  <text x="244" y="57" text-anchor="middle" fill="#1e40af" font-size="7" font-family="Arial">ATENCION 24 HS</text>
  <!-- Puerta -->
  <rect x="8" y="100" width="20" height="80" fill="#fef3c7" stroke="#78350f" stroke-width="2"/>
  <circle cx="22" cy="140" r="2" fill="#78350f"/>
  <rect x="0" y="200" width="300" height="20" fill="#475569"/>
</svg>
