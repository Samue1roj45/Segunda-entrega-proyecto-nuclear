<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f4fc"/>
      <stop offset="100%" stop-color="#c5dce8"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8c9d4"/>
      <stop offset="100%" stop-color="#8fa3b0"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="#7a9bb0"/>
  <rect x="0" y="320" width="960" height="220" fill="url(#floor)"/>
  <rect x="40" y="60" width="880" height="280" fill="url(#wall)" stroke="#6b8fa3" stroke-width="3"/>
  <!-- Recepción -->
  <rect x="60" y="100" width="200" height="200" fill="#d4e8f2" stroke="#5a8aa8" stroke-width="2"/>
  <rect x="80" y="200" width="160" height="70" fill="#8b7355" stroke="#5c4a32" stroke-width="2" rx="4"/>
  <text x="160" y="145" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1e5a7a">RECEPCIÓN</text>
  <rect x="100" y="160" width="50" height="30" fill="#4a90a4" rx="2"/>
  <!-- Camas / observación -->
  <rect x="300" y="120" width="280" height="170" fill="#eef6fa" stroke="#5a8aa8" stroke-width="2"/>
  <text x="440" y="145" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1e5a7a">SALA DE OBSERVACIÓN</text>
  <rect x="320" y="170" width="110" height="55" fill="#fff" stroke="#94b8cc" stroke-width="2" rx="6"/>
  <rect x="330" y="185" width="90" height="35" fill="#dbeafe"/>
  <rect x="450" y="170" width="110" height="55" fill="#fff" stroke="#94b8cc" stroke-width="2" rx="6"/>
  <rect x="460" y="185" width="90" height="35" fill="#dbeafe"/>
  <circle cx="375" cy="200" r="8" fill="#ef4444" opacity="0.8"/>
  <text x="375" y="165" text-anchor="middle" font-size="10" fill="#64748b">Monitor</text>
  <!-- Escritorio médico -->
  <rect x="620" y="100" width="260" height="200" fill="#e0f0f8" stroke="#5a8aa8" stroke-width="2"/>
  <text x="750" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#1e5a7a">ESTACIÓN MÉDICA</text>
  <rect x="680" y="160" width="140" height="60" fill="#a67c52" stroke="#5c4a32" stroke-width="2"/>
  <rect x="700" y="150" width="80" height="50" fill="#fff" stroke="#94a3b8"/>
  <rect x="710" y="155" width="60" height="8" fill="#0ea5e9"/>
  <rect x="710" y="168" width="45" height="6" fill="#cbd5e1"/>
  <!-- Señal urgencias -->
  <rect x="400" y="75" width="160" height="28" fill="#dc2626" rx="4"/>
  <text x="480" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="800" fill="#fff">URGENCIAS</text>
  <!-- Pasillo -->
  <rect x="40" y="360" width="880" height="8" fill="#94a3b8"/>
</svg>
