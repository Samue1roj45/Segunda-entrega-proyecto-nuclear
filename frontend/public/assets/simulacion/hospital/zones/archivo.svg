<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220">
  <defs>
    <pattern id="tile" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#f5f5f4"/>
      <rect width="10" height="10" fill="#e7e5e4"/>
      <rect x="10" y="10" width="10" height="10" fill="#e7e5e4"/>
    </pattern>
  </defs>
  <rect width="300" height="220" fill="url(#tile)"/>
  <rect x="0" y="0" width="300" height="20" fill="#57534e"/>
  <text x="150" y="14" text-anchor="middle" fill="#fafaf9" font-size="9" font-family="Arial" font-weight="bold">ARCHIVO CLINICO</text>
  <!-- Estanterias -->
  <g fill="#78716c" stroke="#44403c">
    <rect x="12" y="32" width="80" height="170"/>
    <rect x="16" y="40" width="72" height="10" fill="#d6d3d1"/>
    <rect x="16" y="56" width="72" height="10" fill="#a8a29e"/>
    <rect x="16" y="72" width="72" height="10" fill="#d6d3d1"/>
    <rect x="16" y="88" width="72" height="10" fill="#a8a29e"/>
    <rect x="16" y="104" width="72" height="10" fill="#d6d3d1"/>
    <rect x="16" y="120" width="72" height="10" fill="#fca5a5" opacity="0.5"/>
    <rect x="108" y="32" width="80" height="170"/>
    <rect x="112" y="40" width="72" height="10" fill="#d6d3d1"/>
    <rect x="112" y="56" width="72" height="10" fill="#a8a29e"/>
    <rect x="112" y="72" width="72" height="10" fill="#d6d3d1"/>
    <rect x="112" y="88" width="72" height="10" fill="#a8a29e"/>
    <rect x="208" y="32" width="80" height="170"/>
    <rect x="212" y="40" width="72" height="10" fill="#d6d3d1"/>
    <rect x="212" y="56" width="72" height="10" fill="#a8a29e"/>
    <rect x="212" y="72" width="72" height="10" fill="#d6d3d1"/>
  </g>
  <!-- Escritorio archivo -->
  <rect x="100" y="168" width="100" height="12" fill="#57534e"/>
  <rect x="108" y="152" width="84" height="20" fill="#a8a29e"/>
  <rect x="140" y="156" width="40" height="14" fill="#fff" stroke="#78716c"/>
  <rect x="144" y="160" width="8" height="6" fill="#1e40af"/>
  <rect x="154" y="160" width="20" height="2" fill="#cbd5e1"/>
  <rect x="154" y="164" width="16" height="2" fill="#cbd5e1"/>
  <!-- Archivador lateral -->
  <rect x="220" y="168" width="56" height="44" fill="#44403c"/>
  <rect x="224" y="172" width="48" height="6" fill="#78716c"/>
  <rect x="224" y="182" width="48" height="6" fill="#78716c"/>
  <rect x="224" y="192" width="48" height="6" fill="#78716c"/>
  <!-- Cartel confidencial -->
  <rect x="8" y="28" width="90" height="24" rx="2" fill="#fef3c7" stroke="#b45309"/>
  <text x="53" y="44" text-anchor="middle" fill="#92400e" font-size="8" font-family="Arial">CONFIDENCIAL</text>
</svg>
