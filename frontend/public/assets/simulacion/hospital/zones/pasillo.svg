<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 56">
  <defs>
    <pattern id="hall" width="80" height="56" patternUnits="userSpaceOnUse">
      <rect width="80" height="56" fill="#cbd5e1"/>
      <line x1="0" y1="28" x2="80" y2="28" stroke="#94a3b8" stroke-width="1"/>
      <line x1="40" y1="0" x2="40" y2="56" stroke="#94a3b8" stroke-width="0.5" opacity="0.4"/>
    </pattern>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="56" fill="url(#hall)"/>
  <rect width="1200" height="20" fill="url(#shine)"/>
  <!-- Zocalo -->
  <rect y="48" width="1200" height="8" fill="#64748b"/>
  <rect y="0" width="1200" height="6" fill="#475569"/>
  <!-- Linea guia suelo -->
  <line x1="0" y1="40" x2="1200" y2="40" stroke="#e2e8f0" stroke-width="3" stroke-dasharray="24 16"/>
  <!-- Senales direccion -->
  <g font-family="Arial" font-weight="bold" font-size="8">
    <rect x="60" y="10" width="72" height="26" rx="2" fill="#1e40af"/>
    <text x="96" y="27" text-anchor="middle" fill="#fff">UCI</text>
    <polygon points="132,23 142,18 142,28" fill="#1e40af"/>
    <rect x="280" y="10" width="100" height="26" rx="2" fill="#9f1239"/>
    <text x="330" y="27" text-anchor="middle" fill="#fff">ENFERMERIA</text>
    <rect x="520" y="10" width="88" height="26" rx="2" fill="#047857"/>
    <text x="564" y="27" text-anchor="middle" fill="#fff">URGENCIAS</text>
    <rect x="780" y="10" width="80" height="26" rx="2" fill="#b45309"/>
    <text x="820" y="27" text-anchor="middle" fill="#fff">ARCHIVO</text>
    <rect x="1020" y="10" width="90" height="26" rx="2" fill="#334155"/>
    <text x="1065" y="27" text-anchor="middle" fill="#fff">SALIDA</text>
  </g>
  <!-- Luces techo -->
  <g fill="#fef9c3" opacity="0.7">
    <rect x="150" y="2" width="40" height="4" rx="1"/>
    <rect x="400" y="2" width="40" height="4" rx="1"/>
    <rect x="650" y="2" width="40" height="4" rx="1"/>
    <rect x="900" y="2" width="40" height="4" rx="1"/>
  </g>
  <!-- Extintor -->
  <rect x="8" y="18" width="12" height="28" fill="#dc2626"/>
  <rect x="10" y="20" width="8" height="6" fill="#fef2f2"/>
</svg>
