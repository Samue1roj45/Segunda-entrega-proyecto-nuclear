<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220">
  <defs>
    <pattern id="vinyl" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#dbeafe"/>
      <circle cx="20" cy="20" r="1.5" fill="#93c5fd" opacity="0.4"/>
    </pattern>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="300" height="220" fill="url(#vinyl)"/>
  <rect width="300" height="220" fill="url(#wall)" opacity="0.35"/>
  <!-- Pared fondo -->
  <rect x="8" y="28" width="284" height="100" fill="#f1f5f9" stroke="#cbd5e1"/>
  <!-- Cartel urgencias -->
  <rect x="200" y="36" width="82" height="28" rx="2" fill="#dc2626" stroke="#991b1b"/>
  <rect x="204" y="40" width="74" height="8" fill="#fef2f2" opacity="0.3"/>
  <text x="241" y="54" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="11" font-weight="bold">URGENCIAS</text>
  <!-- Mostrador L -->
  <rect x="20" y="72" width="150" height="14" fill="#475569"/>
  <rect x="20" y="72" width="14" height="72" fill="#475569"/>
  <rect x="24" y="76" width="142" height="8" fill="#64748b"/>
  <rect x="24" y="90" width="8" height="50" fill="#64748b"/>
  <rect x="36" y="88" width="120" height="4" fill="#94a3b8"/>
  <!-- PC + lampara -->
  <rect x="130" y="78" width="28" height="20" rx="1" fill="#1e293b"/>
  <rect x="132" y="80" width="24" height="14" fill="#38bdf8" opacity="0.5"/>
  <rect x="48" y="62" width="8" height="18" fill="#fde68a"/>
  <ellipse cx="52" cy="58" rx="10" ry="5" fill="#fef08a" opacity="0.6"/>
  <!-- Ventanilla -->
  <rect x="188" y="72" width="90" height="88" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/>
  <rect x="194" y="78" width="78" height="50" fill="#bae6fd" opacity="0.5"/>
  <rect x="210" y="132" width="46" height="22" fill="#94a3b8"/>
  <circle cx="248" cy="143" r="3" fill="#1e293b"/>
  <!-- Sillas espera -->
  <g fill="#64748b">
    <rect x="32" y="158" width="22" height="6" rx="2"/>
    <rect x="34" y="148" width="18" height="12" rx="3" fill="#94a3b8"/>
    <rect x="68" y="158" width="22" height="6" rx="2"/>
    <rect x="70" y="148" width="18" height="12" rx="3" fill="#94a3b8"/>
    <rect x="104" y="158" width="22" height="6" rx="2"/>
    <rect x="106" y="148" width="18" height="12" rx="3" fill="#94a3b8"/>
  </g>
  <!-- Puerta sala espera -->
  <rect x="278" y="100" width="14" height="70" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <circle cx="285" cy="135" r="2" fill="#b45309"/>
  <!-- Senal verde -->
  <rect x="12" y="188" width="56" height="22" rx="2" fill="#166534"/>
  <text x="40" y="203" text-anchor="middle" fill="#fff" font-size="8" font-family="Arial">ENTRADA</text>
  <!-- Base zocalo -->
  <rect x="0" y="208" width="300" height="12" fill="#94a3b8"/>
</svg>
