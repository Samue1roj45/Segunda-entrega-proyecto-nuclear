name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Pruebas del backend
        working-directory: backend
        run: mvn -B -q test

  # Las pruebas usan H2; aquí se comprueba que todas las migraciones (Flyway) corren en MySQL de verdad y que el servicio arranca.
  backend-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: plataforma_casos
          MYSQL_USER: plataforma
          MYSQL_PASSWORD: clave-ci
          MYSQL_ROOT_PASSWORD: clave-ci-root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pclave-ci-root"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Compilar
        working-directory: backend
        run: mvn -B -q -DskipTests package
      - name: Arrancar contra MySQL y esperar a que respondan las rutas protegidas
        working-directory: backend
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/plataforma_casos?serverTimezone=America/Bogota
          DB_USER: plataforma
          DB_PASSWORD: clave-ci
          # Base64 de "secreto-solo-para-ci-con-mas-de-treinta-y-dos-caracteres" (ConfiguracionJwt exige Base64)
          JWT_SECRETO: c2VjcmV0by1zb2xvLXBhcmEtY2ktY29uLW1hcy1kZS10cmVpbnRhLXktZG9zLWNhcmFjdGVyZXM=
          SPRING_PROFILES_ACTIVE: pruebas
          AVISOS_CORREO: 'false'
        run: |
          java -jar target/*.jar > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/avisos || true)
            if [ "$code" = "401" ]; then echo "Servicio arriba (migraciones aplicadas)"; exit 0; fi
            sleep 3
          done
          tail -n 80 /tmp/backend.log
          exit 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/soma-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/soma-web/package-lock.json }
      - run: npm ci
      - name: Compilación de producción
        run: npx ng build
      - name: Pruebas unitarias
        run: npx ng test --watch=false
      - name: Navegador para las pruebas de extremo a extremo
        run: npx playwright install --with-deps chromium
      - name: Recorridos e2e (servidor simulado)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: resultados-playwright, path: frontend/soma-web/test-results }
