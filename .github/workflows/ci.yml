name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Pruebas del backend
        working-directory: backend
        run: mvn -B -q test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/soma-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/soma-web/package-lock.json }
      - run: npm ci
      - name: Compilación de producción
        run: npx ng build
      - name: Pruebas unitarias
        run: npx ng test --watch=false
      - name: Navegador para las pruebas de extremo a extremo
        run: npx playwright install --with-deps chromium
      - name: Recorridos e2e (servidor simulado)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: resultados-playwright, path: frontend/soma-web/test-results }
