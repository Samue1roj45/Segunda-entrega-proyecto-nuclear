# Configuración única del backend (módulos 1 a 6). Las credenciales se leen de variables de entorno;
# nunca se escriben en el código. Ver .env.example en la raíz del repositorio.
spring:
  application:
    name: plataforma-casos
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/plataforma_casos?serverTimezone=America/Bogota}
    username: ${DB_USER:plataforma}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # El esquema lo controla Flyway (migraciones de cada módulo), no Hibernate.
    properties:
      hibernate:
        jdbc:
          time_zone: America/Bogota
  flyway:
    # Cada módulo aporta sus migraciones: V1-V9 módulo 1, V20-V29 módulo 2, V30-V39 módulos 3 y 4,
    # V40-V49 módulos 5 y 6.
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}

server:
  port: ${SERVER_PORT:8080}

app:
  # Zona horaria de las fechas de sesiones, intentos y notificaciones (Clock único de la aplicación).
  zona-horaria: ${ZONA_HORARIA:America/Bogota}
  autenticacion:
    # Dominio aceptado por RF-01. Se configura por entorno.
    dominio-institucional: ${DOMINIO_INSTITUCIONAL:institucion.edu.co}
  seguridad:
    # Clave HMAC (Base64, mínimo 32 bytes) para firmar los tokens de TODOS los módulos.
    # Si se deja vacía se genera una aleatoria al arrancar (los tokens no sobreviven a un reinicio).
    jwt-secreto: ${JWT_SECRETO:}
    minutos-token: ${JWT_MINUTOS:60}
  cors:
    # Orígenes de los frontends Angular, separados por coma.
    origenes: ${CORS_ORIGENES:http://localhost:4200}
  mail:
    from: ${MAIL_FROM:no-reply@institucion.edu.co}
  sesiones:
    # RF-22: "mitad" (mitad del tiempo máximo) o "porcentaje" (porcentaje_limite_ingreso_tardio de la sesión).
    politica-ingreso-tardio: ${POLITICA_INGRESO_TARDIO:mitad}
    # RF-19 y RF-23: cada cuánto se cierran sesiones vencidas e intentos sin tiempo.
    intervalo-cierre-ms: 60000
    intervalo-expiracion-ms: 30000
    # RF-20: longitud del código de acceso que recibe cada estudiante convocado.
    longitud-codigo: 8

---
# Perfil para ejecutar los casos de prueba con datos ficticios (usuarios, un caso publicado y una sesión).
spring:
  config:
    activate:
      on-profile: pruebas
  flyway:
    locations: classpath:db/migration,classpath:db/semilla
