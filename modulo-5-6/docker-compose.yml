services:
  db:
    image: mysql:8.0
    container_name: evaluacion_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DB:-evaluacion_db}
      MYSQL_USER: ${MYSQL_USER:-evaluacion_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-evaluacion_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-evaluacion_root}
    ports:
      - "${MYSQL_HOST_PORT:-5435}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-evaluacion_root}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
